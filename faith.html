    --c1: #e8366a; --c2: #e8590c; --c3: #17985a; --c4: #0b8f9c; --c5: #2f6bff; --c6: #8a4dff;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161433; --surface: #221f47; --ink: #f4f2ff; --muted: #aeaad6; --line: #3a3670;
      --c1: #ff5c8a; --c2: #ff7a2e; --c3: #2fc477; --c4: #19b8c4; --c5: #5c8cff; --c6: #a77bff;
      --sun: #ffd23f; --sun-ink: #2c1f00;
      --good: #3fd98a; --good-soft: #173a2b; --bad: #ff7a6b; --bad-soft: #45201c;
      --abel: #5cc84f; --noah: #3fb0f0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161433; --surface: #221f47; --ink: #f4f2ff; --muted: #aeaad6; --line: #3a3670;
    --c1: #ff5c8a; --c2: #ff7a2e; --c3: #2fc477; --c4: #19b8c4; --c5: #5c8cff; --c6: #a77bff;
    --sun: #ffd23f; --sun-ink: #2c1f00;
    --good: #3fd98a; --good-soft: #173a2b; --bad: #ff7a6b; --bad-soft: #45201c;
    --abel: #5cc84f; --noah: #3fb0f0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 18px/1.6 var(--body);
    background:
      radial-gradient(circle at 0% 0%, color-mix(in srgb, var(--c1) 22%, transparent), transparent 35%),
      radial-gradient(circle at 100% 15%, color-mix(in srgb, var(--c5) 22%, transparent), transparent 35%),
      radial-gradient(circle at 15% 70%, color-mix(in srgb, var(--sun) 25%, transparent), transparent 35%),
      radial-gradient(circle at 95% 95%, color-mix(in srgb, var(--c3) 20%, transparent), transparent 35%),
      var(--bg);
    background-attachment: fixed;
  }
  main { max-width: 700px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 80px; display: grid; gap: 18px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
  h1 { font-size: 2.3rem; }
  h2 { font-size: 1.5rem; color: var(--step, var(--ink)); }
  h3 { font-size: 1.25rem; font-weight: 600; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .eyebrow { font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c6); }
  .rainbow {
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--sun), var(--c3), var(--c5), var(--c6));
    -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 2.8rem;
  }
  .panel {
    background: var(--surface); border: 2px solid color-mix(in srgb, var(--step, var(--c5)) 35%, var(--line));
    border-top: 8px solid var(--step, var(--c5)); border-radius: 20px; padding: 20px; display: grid; gap: 16px;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--step, var(--c5)) 15%, transparent);
  }
  button, a.btn { font: inherit; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px;
    border: 0; border-radius: 14px; padding: 12px 20px; font-weight: 800; cursor: pointer; text-decoration: none;
    background: linear-gradient(135deg, var(--step, var(--c5)), color-mix(in srgb, var(--step, var(--c5)) 60%, var(--c6)));
    color: var(--on-color); box-shadow: 0 4px 0 color-mix(in srgb, var(--step, var(--c5)) 55%, #000);
  }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 color-mix(in srgb, var(--step, var(--c5)) 55%, #000); }
  .btn.soft { background: color-mix(in srgb, var(--step, var(--c5)) 15%, var(--surface)); color: var(--ink); box-shadow: none; border: 2px solid color-mix(in srgb, var(--step, var(--c5)) 40%, transparent); }
  .btn.small { min-height: 40px; padding: 6px 14px; font-size: .9rem; }
  .btn:disabled { opacity: .4; cursor: default; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .between { justify-content: space-between; }
  .bar { height: 14px; background: color-mix(in srgb, var(--c5) 15%, var(--surface)); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 99px; transition: width .4s; background: linear-gradient(90deg, var(--c1), var(--c2), var(--sun), var(--c3), var(--c5), var(--c6)); }

  /* Home */
  .hero { display: grid; gap: 8px; }
  .score { display: flex; justify-content: space-between; font-weight: 800; font-variant-numeric: tabular-nums; }
  .char-card {
    display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; width: 100%; text-align: left;
    background: linear-gradient(135deg, color-mix(in srgb, var(--hue) 28%, var(--surface)), var(--surface) 70%);
    border: 3px solid var(--hue); border-radius: 20px; padding: 16px; cursor: pointer; color: inherit;
    box-shadow: 0 6px 0 color-mix(in srgb, var(--hue) 45%, transparent);
  }
  .char-card:hover { transform: translateY(-2px); }
  .char-card > div { min-width: 0; display: grid; gap: 6px; }
  .char-card .eyebrow { color: var(--hue); }
  .avatar {
    width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; font-size: 2.1rem;
    background: var(--hue); border: 4px solid var(--surface); box-shadow: 0 0 0 3px var(--hue);
  }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 99px; border: 2px solid color-mix(in srgb, var(--s, var(--line)) 45%, transparent); color: var(--muted); }
  .badge.on { background: var(--s, var(--sun)); border-color: var(--s, var(--sun)); color: var(--on-color); }

  .card-title { font-size: .92rem; line-height: 1.35; }
  .dots { display: inline-flex; gap: 5px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--s); }
  .dots span.on { background: var(--s); }
  .stars.mini { font-size: 1.05rem; letter-spacing: 1px; text-align: left; }
  .char-card { padding: 14px; }
  .char-card .avatar { width: 58px; height: 58px; font-size: 1.8rem; }

  /* Trail */
  .trail { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .stop {
    border: 2px solid color-mix(in srgb, var(--s) 40%, transparent); background: color-mix(in srgb, var(--s) 12%, var(--surface));
    color: var(--ink); border-radius: 14px; padding: 8px 2px; cursor: pointer; display: grid; justify-items: center; gap: 2px;
    font-size: .75rem; font-weight: 800; min-width: 0;
  }
  .stop .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); background: color-mix(in srgb, var(--s) 35%, var(--surface)); color: var(--ink); }
  .stop.done .dot { background: var(--s); color: var(--on-color); }
  .stop.active { border-color: var(--s); background: color-mix(in srgb, var(--s) 25%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--s) 30%, transparent); }

  /* Meet */
  .facts { display: grid; border-radius: 16px; overflow: hidden; }
  .fact { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--s) 14%, var(--surface)); }
  .fact b { color: var(--s); font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; filter: brightness(.85); }
  .fact span { min-width: 0; }
  .big-idea { background: linear-gradient(135deg, color-mix(in srgb, var(--sun) 45%, var(--surface)), color-mix(in srgb, var(--c2) 25%, var(--surface))); border-radius: 16px; padding: 16px; font-weight: 800; font-size: 1.05rem; }

  /* Story order */
  .slots { display: grid; gap: 8px; }
  .slot { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: color-mix(in srgb, var(--s) 18%, var(--surface)); font-weight: 700; }
  .slot i { font-style: normal; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--s); color: var(--on-color); font-family: var(--display); }
  .slot.empty { background: transparent; border: 2px dashed color-mix(in srgb, var(--s) 45%, transparent); color: var(--muted); }
  .slot.empty i { background: color-mix(in srgb, var(--s) 25%, var(--surface)); color: var(--ink); }
  .pile { display: grid; gap: 8px; }

  /* Chips, flips, quiz */
  .chip {
    border: 2px solid color-mix(in srgb, var(--s, var(--c5)) 45%, transparent); background: color-mix(in srgb, var(--s, var(--c5)) 10%, var(--surface));
    color: var(--ink); border-radius: 14px; padding: 12px 14px; text-align: left; cursor: pointer; font-weight: 700; min-height: 54px; width: 100%;
  }
  .chip:hover:not(:disabled) { border-color: var(--s, var(--c5)); background: color-mix(in srgb, var(--s, var(--c5)) 20%, var(--surface)); }
  .chip.verse { font-family: var(--display); font-weight: 600; background: var(--s); color: var(--on-color); border-color: var(--s); }
  .chip.verse:hover:not(:disabled) { background: var(--s); filter: brightness(1.08); }
  .chip.picked { border-color: var(--ink); box-shadow: 0 0 0 3px var(--sun); }
  .chip.matched, .chip.verse.matched { border-color: var(--good); background: var(--good-soft); color: var(--ink); cursor: default; }
  .chip.shake { animation: shake .35s; border-color: var(--bad); }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .match .col { display: grid; gap: 10px; align-content: start; min-width: 0; }

  .flips { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .flip { perspective: 900px; border: 0; padding: 0; background: none; cursor: pointer; color: inherit; text-align: left; min-height: 170px; }
  .flip-inner { position: relative; width: 100%; height: 100%; min-height: 170px; transition: transform .5s; transform-style: preserve-3d; }
  .flip.turned .flip-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; padding: 14px; display: grid; align-content: space-between; gap: 6px; }
  .face.front { background: linear-gradient(145deg, var(--s), color-mix(in srgb, var(--s) 65%, var(--c6))); color: var(--on-color); }
  .face.back { background: color-mix(in srgb, var(--s) 15%, var(--surface)); border: 3px solid var(--s); transform: rotateY(180deg); }
  .face small { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
  .face strong { font-family: var(--display); font-weight: 600; font-size: 1.1rem; line-height: 1.3; }

  .opts { display: grid; gap: 10px; }
  .chip.right { border-color: var(--good); background: var(--good-soft); }
  .chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tf .chip { text-align: center; font-family: var(--display); font-size: 1.3rem; }
  .feedback { font-weight: 800; padding: 12px 14px; border-radius: 14px; }
  .feedback.good { background: var(--good-soft); border: 2px solid var(--good); }
  .feedback.bad { background: var(--bad-soft); border: 2px solid var(--bad); }
  .tag { display: inline-block; background: var(--sun); color: var(--sun-ink); border-radius: 99px; padding: 3px 12px; font-weight: 800; font-size: .85rem; width: fit-content; }
  .stars { font-size: 2.8rem; letter-spacing: 6px; text-align: center; }
  .stars .on { color: var(--sun); text-shadow: 0 2px 0 color-mix(in srgb, var(--sun) 50%, #000); } .stars .off { color: var(--line); }

  /* Think */
  .checks { display: grid; gap: 8px; }
  .check { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border: 2px solid color-mix(in srgb, var(--s) 45%, transparent); background: color-mix(in srgb, var(--s) 10%, var(--surface)); border-radius: 14px; cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--s); }
  .check:has(input:checked) { border-color: var(--s); background: color-mix(in srgb, var(--s) 25%, var(--surface)); }
  textarea { width: 100%; min-height: 110px; font: inherit; padding: 12px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--s) 45%, transparent); background: color-mix(in srgb, var(--s) 6%, var(--surface)); color: var(--ink); resize: vertical; }
  label.q { font-weight: 800; color: var(--s); filter: brightness(.9); }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  @media (max-width: 460px) {
    .trail { grid-template-columns: repeat(3, 1fr); }
    .match { grid-template-columns: 1fr; }
    .fact { grid-template-columns: 1fr; gap: 0; }
    .rainbow { font-size: 2.3rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flip-inner, .bar > div { transition: none; }
    .chip.shake { animation: none; }
    .char-card:hover { transform: none; }
  }
</style>

const PAL = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];
const col = i => PAL[i % PAL.length];
const STEPS = ["Meet", "Story", "Facts", "Match", "Quiz", "Think"];

// ---------- storage (per device) ----------
const KEY = "zena-faith-v1";
let state; try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const rec = id => (state[id] ||= { done: {}, stars: 0, notes: {}, goals: {} });
const complete = (id, step) => { const r = rec(id); if (!r.done[step]) { r.done[step] = true; save(); } };

// ---------- helpers ----------
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starsHtml = n => [0, 1, 2].map(i => `<span class="${i < n ? "on" : "off"}">★</span>`).join("");
const points = id => { const r = rec(id); return Object.keys(r.done).length + r.stars; }; // 6 badges + 3 stars


// ---------- confetti ----------
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti() {
  if (calm) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#ffb703", "#2d5fd3", "#4f9a3a", "#1f8fb3", "#ff8a75"];
  const bits = Array.from({ length: 130 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4, vx: (Math.random() - .5) * 3,
    vy: 2 + Math.random() * 3, r: Math.random() * 6.3, s: 6 + Math.random() * 7, c: colors[Math.floor(Math.random() * colors.length)]
  }));
  let t = 0;
  (function frame() {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.r += .1;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); cx.restore();
    }
    if (++t < 180) requestAnimationFrame(frame); else cx.clearRect(0, 0, cv.width, cv.height);
  })();
}

// ---------- home ----------
function home() {
  const total = CHARACTERS.reduce((s, c) => s + points(c.id), 0), max = CHARACTERS.length * 9;
  const finished = c => STEPS.every(s => rec(c.id).done[s]);
  const doneCount = CHARACTERS.filter(finished).length;
  const nextUp = CHARACTERS.find(c => !finished(c));
  app.innerHTML = `
    <header class="hero">
      <span class="eyebrow">Imitate Their Faith</span>
      <h1 class="rainbow">Faith Explorers</h1>
      <p class="muted">Meet Bible people who had strong faith. Each chapter has 6 stops to explore.</p>

    <section class="panel">
      <div class="score"><span>Your points</span><span>${total} / ${max}</span></div>
      <div class="bar"><div style="width:${(total / max) * 100}%"></div></div>
      <p class="muted"><b>${doneCount}</b> of ${CHARACTERS.length} chapters finished</p>
      ${nextUp ? `<button class="btn" id="carryOn" style="--step:${nextUp.hue}">Carry on: ${esc(nextUp.name)}, chapter ${nextUp.chapter} →</button>` : `<p><b>You finished every chapter. Amazing!</b></p>`}
    </section>
    ${CHARACTERS.map(c => {
      const r = rec(c.id);
      return `<button class="char-card" data-id="${c.id}" style="--hue:${c.hue}">

        <div>

          <h3>${esc(c.name)}</h3>
          <p class="muted card-title">${esc(c.title)}</p>
          <div class="row" style="gap:6px">
            <span class="dots">${STEPS.map((s, i) => `<span class="${r.done[s] ? "on" : ""}" style="--s:${col(i)}" title="${s}"></span>`).join("")}</span>
            <span class="stars mini">${starsHtml(r.stars)}</span>
          </div>
        </div>
      </button>`;
    }).join("")}`;
  const go = document.getElementById("carryOn");
  if (go) go.onclick = () => openChar(nextUp.id);

  scrollTo(0, 0);
}
function openChar(id) {
  const r = rec(id), i = STEPS.findIndex(s => !r.done[s]);

}

    <nav class="trail" style="--hue:${c.hue}" aria-label="Stops">
      ${STEPS.map((s, i) => `<button class="stop ${r.done[s] ? "done" : ""} ${i === step ? "active" : ""}" data-i="${i}" style="--s:${col(i)}">
        <span class="dot">${r.done[s] ? "✓" : i + 1}</span>${s}</button>`).join("")}
    </nav>
    <section class="panel" id="stage" style="--step:${col(step)}"></section>`;
  document.getElementById("back").onclick = home;
  app.querySelectorAll(".stop").forEach(b => b.onclick = () => character(id, +b.dataset.i));
  const stage = document.getElementById("stage");
  const next = () => character(id, Math.min(step + 1, STEPS.length - 1));
  [meet, story, facts, match, quiz, think][step](c, stage, next);
  scrollTo(0, 0);
}
const nextBtn = () => `<div class="row"><button class="btn" id="go" disabled>Next stop →</button></div>`;
function unlock(stage, next, label) { const g = stage.querySelector("#go"); g.disabled = false; if (label) g.textContent = label; g.onclick = next; }

// ---------- 1. Meet ----------
function meet(c, stage, next) {
  stage.innerHTML = `
    <h2>Meet ${esc(c.name)}</h2>
    <div class="big-idea">${esc(c.bigIdea)}</div>
    <div class="facts">${c.facts.map(([k, v], i) => `<div class="fact" style="--s:${col(i)}"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("")}</div>
    <p>Now read the chapter together. Take turns reading the paragraphs out loud.</p>
    <div class="row">
      <a class="btn soft" href="${c.url}" target="_blank" rel="noopener">Open the chapter ↗</a>
      <button class="btn" id="readDone">${rec(c.id).done.Meet ? "Read ✓" : "We've read it"}</button>
    </div>
    ${nextBtn()}`;
  if (rec(c.id).done.Meet) unlock(stage, next);
  stage.querySelector("#readDone").onclick = e => { complete(c.id, "Meet"); e.target.textContent = "Read ✓"; unlock(stage, next); };
}

// ---------- 2. Story order ----------
function story(c, stage, next) {
  let placed = 0, mistakes = 0;
  const pile = shuffle(c.story.map((t, i) => ({ t, i })));
  stage.innerHTML = `
    <h2>Put the story in order</h2>
    <p class="muted">Tap what happened <b>first</b>, then what happened next, and so on.</p>
    <div class="slots">${c.story.map((_, i) => `<div class="slot empty" data-slot="${i}" style="--s:${col(i)}"><i>${i + 1}</i><span>?</span></div>`).join("")}</div>
    <div class="pile">${pile.map((p, k) => `<button class="chip" data-i="${p.i}" style="--s:${col(k + 2)}">${esc(p.t)}</button>`).join("")}</div>
    <p id="msg" class="muted" aria-live="polite"></p>
    ${nextBtn()}`;
  if (rec(c.id).done.Story) unlock(stage, next);
  const msg = stage.querySelector("#msg");
  stage.querySelectorAll(".pile .chip").forEach(b => b.onclick = () => {
    if (+b.dataset.i === placed) {
      const slot = stage.querySelector(`[data-slot="${placed}"]`);
      slot.classList.remove("empty"); slot.querySelector("span").textContent = c.story[placed];
      b.remove(); placed++;
      msg.textContent = placed < c.story.length ? "Yes! What happened next?" : "";
      if (placed === c.story.length) {
        msg.textContent = mistakes === 0 ? "Perfect! You know this story well." : `Story complete! (${mistakes} wrong tries)`;
        complete(c.id, "Story"); confetti(); unlock(stage, next, "Story done! Next stop →");
      }
    } else {
      mistakes++; b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400);
      msg.textContent = "Not yet. Something else happened before that.";
    }
  });
}

// ---------- 3. Fact cards ----------
function facts(c, stage, next) {
  const seen = new Set();
  stage.innerHTML = `
    <h2>Did you know?</h2>
    <p class="muted">Guess the answer, then tap to flip. <b id="n">0</b> of ${c.cards.length} flipped.</p>
    <div class="flips">${c.cards.map(([q, a], i) => `
      <button class="flip" data-i="${i}" aria-label="Flip card ${i + 1}" style="--s:${col(i)}">
        <div class="flip-inner">
          <div class="face front"><small>Question ${i + 1}</small><strong>${esc(q)}</strong><small>Tap to flip</small></div>
          <div class="face back"><small>Answer</small><strong>${esc(a)}</strong><small>Tap to flip back</small></div>
        </div>
      </button>`).join("")}</div>
    ${nextBtn()}`;
  if (rec(c.id).done.Facts) unlock(stage, next);
  stage.querySelectorAll(".flip").forEach(b => b.onclick = () => {
    b.classList.toggle("turned"); seen.add(b.dataset.i);
    stage.querySelector("#n").textContent = seen.size;
    if (seen.size === c.cards.length) { complete(c.id, "Facts"); unlock(stage, next, "All flipped! Next stop →"); }
  });
}

// ---------- 4. Verse match ----------
function match(c, stage, next) {
  const L = shuffle(c.pairs.map((p, i) => ({ i, t: p[0] }))), R = shuffle(c.pairs.map((p, i) => ({ i, t: p[1] })));
  let picked = null, matched = 0, tries = 0;
  stage.innerHTML = `
    <h2>Match the verses</h2>
    <p class="muted">Tap a verse, then tap what it says. Look them up in your Bible to check!</p>
    <div class="match">
      <div class="col">${L.map((x, k) => `<button class="chip verse" style="--s:${col(k)}" data-i="${x.i}" data-side="L">${esc(x.t)}</button>`).join("")}</div>
      <div class="col">${R.map((x, k) => `<button class="chip" style="--s:${col(k + 3)}" data-i="${x.i}" data-side="R">${esc(x.t)}</button>`).join("")}</div>
    </div>
    <p id="msg" class="muted" aria-live="polite"></p>
    ${nextBtn()}`;
  if (rec(c.id).done.Match) unlock(stage, next);
  const msg = stage.querySelector("#msg");
  stage.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    if (b.classList.contains("matched")) return;
    if (!picked || picked.dataset.side === b.dataset.side) {
      if (picked) picked.classList.remove("picked");
      picked = b; b.classList.add("picked"); return;
    }
    tries++;
    if (picked.dataset.i === b.dataset.i) {
      [picked, b].forEach(x => { x.classList.remove("picked"); x.classList.add("matched"); x.disabled = true; });
      matched++; msg.textContent = "Nice match!";
      if (matched === c.pairs.length) {
        msg.textContent = tries === matched ? "Perfect, no mistakes!" : `All matched in ${tries} tries.`;
        complete(c.id, "Match"); confetti(); unlock(stage, next, "Matched! Next stop →");
      }
    } else {
      [picked, b].forEach(x => { x.classList.remove("picked"); x.classList.add("shake"); setTimeout(() => x.classList.remove("shake"), 400); });
      msg.textContent = "Not a match. Try again!";
    }
    picked = null;
  });
}

// ---------- 5. Quiz ----------
function quiz(c, stage, next) {
  const qs = shuffle(c.quiz);
  let i = 0, score = 0, streak = 0;
  function show() {
    const it = qs[i], opts = it.tf ? null : shuffle(it.o.map((t, n) => ({ t, n })));
    stage.innerHTML = `
      <div class="row between"><span class="eyebrow">Question ${i + 1} of ${qs.length}</span>
        <b style="color:var(--accent)">${streak > 1 ? `🔥 ${streak} in a row` : ""}</b></div>
      <div class="bar"><div style="width:${(i / qs.length) * 100}%"></div></div>
      ${it.tf ? `<span class="tag">True or false?</span>` : ""}
      <h2>${esc(it.q)}</h2>
      ${it.tf ? `<div class="tf"><button class="chip" data-v="true" style="--s:var(--c3)">True</button><button class="chip" data-v="false" style="--s:var(--c1)">False</button></div>`
              : `<div class="opts">${opts.map((o, k) => `<button class="chip" data-v="${o.n}" style="--s:${col(k + i)}">${esc(o.t)}</button>`).join("")}</div>`}
      <p class="feedback" id="fb" hidden aria-live="polite"></p>
      <div class="row"><button class="btn" id="qn" hidden>${i + 1 < qs.length ? "Next question →" : "See my stars"}</button></div>`;
    const btns = stage.querySelectorAll(".chip"), right = String(it.a);
    btns.forEach(b => b.onclick = () => {
      const ok = b.dataset.v === right;
      btns.forEach(x => { x.disabled = true; if (x.dataset.v === right) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      score += ok; streak = ok ? streak + 1 : 0;
      const fb = stage.querySelector("#fb"); fb.hidden = false; fb.className = "feedback " + (ok ? "good" : "bad");
      fb.textContent = (ok ? "Correct! " : "Not quite. ") + it.why;
      const n = stage.querySelector("#qn"); n.hidden = false; n.focus();
      n.onclick = () => (++i < qs.length ? show() : finish());
    });
  }
  function finish() {
    const stars = score >= qs.length ? 3 : score >= qs.length - 2 ? 2 : score >= qs.length / 2 ? 1 : 0;
    const r = rec(c.id); r.stars = Math.max(r.stars, stars); complete(c.id, "Quiz"); save();
    if (stars === 3) confetti();
    stage.innerHTML = `
      <h2 style="text-align:center">${stars === 3 ? "Perfect score!" : stars === 2 ? "Great job!" : "Good try! Have another go."}</h2>
      <p class="muted" style="text-align:center">You got ${score} out of ${qs.length} right.</p>
      <div class="stars">${starsHtml(stars)}</div>
      ${r.stars > stars ? `<p class="muted" style="text-align:center">Your best is still ${r.stars} stars.</p>` : ""}
      <div class="row" style="justify-content:center">
        <button class="btn soft" id="again">Try again</button><button class="btn" id="go">Next stop →</button>
      </div>`;
    stage.querySelector("#again").onclick = () => quiz(c, stage, next);
    stage.querySelector("#go").onclick = next;
  }
  show();
}

// ---------- 6. Think ----------
function think(c, stage) {
  const r = rec(c.id);
  stage.innerHTML = `
    <h2>Think about it</h2>
    <p class="muted">Write a few words for each one, then talk about them together.</p>
    ${c.think.map((q, i) => `
      <div style="display:grid;gap:6px;--s:${col(i)}">
        <label class="q" for="${c.id}-t${i}">${esc(q)}</label>
        <textarea id="${c.id}-t${i}" data-i="${i}" placeholder="My answer…">${esc(r.notes[i] || "")}</textarea>
      </div>`).join("")}
    <h2>Be like ${esc(c.name)}</h2>
    <p class="muted">Pick at least one thing to try this week. Tick it when you've done it!</p>
    <div class="checks">${c.goals.map((g, i) => `
      <label class="check" for="${c.id}-g${i}" style="--s:${col(i + 3)}"><input type="checkbox" id="${c.id}-g${i}" data-g="${i}" ${r.goals[i] ? "checked" : ""}><span>${esc(g)}</span></label>`).join("")}</div>
    <div class="row"><button class="btn" id="saveT">Save</button><span id="saved" class="muted" aria-live="polite"></span></div>
    <div class="row"><button class="btn soft" id="home2">Back to all characters</button></div>`;
  stage.querySelector("#saveT").onclick = () => {
    stage.querySelectorAll("textarea").forEach(t => r.notes[t.dataset.i] = t.value.trim());
    stage.querySelectorAll("[data-g]").forEach(x => r.goals[x.dataset.g] = x.checked);
    const wrote = Object.values(r.notes).some(Boolean);
    if (!wrote) { stage.querySelector("#saved").textContent = "Write an answer to at least one question first."; save(); return; }
    const first = !r.done.Think; complete(c.id, "Think"); save();
    stage.querySelector("#saved").textContent = "Saved ✓";
    if (first && STEPS.every(s => r.done[s])) confetti();
  };
  stage.querySelector("#home2").onclick = home;
}

home();
</script>
